version: "3.9"

services:
  db:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=sqlchallenge
      - POSTGRES_PASSWORD=sqlchallenge
      - POSTGRES_DB=sqlchallenge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqlchallenge"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: web/api/Dockerfile
    container_name: pokedex-api
    environment:
      - POKEDEX_DB_HOST=db
      - POKEDEX_DB_PORT=5432
      - POKEDEX_DB_NAME=sqlchallenge
      - POKEDEX_DB_ADMIN_USER=sqlchallenge
      - POKEDEX_DB_ADMIN_PASSWORD=sqlchallenge
      - POKEDEX_DB_WEB_USER=sqlchallenge_web
      - POKEDEX_DB_WEB_PASSWORD=sqlchallenge_web
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    image: node:20-alpine
    container_name: pokedex-frontend
    working_dir: /app
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    volumes:
      - ./web/frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:5173 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
